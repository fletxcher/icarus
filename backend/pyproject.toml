[project]
name = "api"
version = "0.1.0"
description = "Icarus API: chat storage and the LangGraph aerodynamics agent"
authors = [
    { name = "fletxcher", email = "fletxcher@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.24.1",
    "fastapi[standard]>=0.159.1",
    "langchain-mistralai>=1.1.6",
    "langgraph>=1.2.16",
    "pydantic-settings>=2.16.1",
    "pymongo>=4.19.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "api"
version = "0.1.0"
description = "Icarus API: chat storage and the LangGraph aerodynamics agent"
authors = [
    { name = "fletxcher", email = "fletxcher@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncssh>=2.24.1",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.159.1",
    "langchain-mistralai>=1.1.6",
    "langchain-ollama>=1.1.0",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.16",
    "numpy>=2.5.4",
    "plotly>=7.1.0",
    "pydantic-settings>=2.16.1",
    "pymongo>=4.19.0",
    "pypdf>=6.21.3",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api = "api:main"
export-schemas = "api.schema_export:main"
claim-data = "api.claim_data:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.vercel]
# Where Vercel finds the FastAPI app. Its imports are relative, so it works loaded as
# `src.api.app` here and as `api.app` locally (uvicorn, tests).
entrypoint = "src.api.app:app"

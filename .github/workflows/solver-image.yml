# Builds the solver image that setup.sh pulls, tagged with the hash of workstation/Dockerfile.
# The repo is private, so this stays cheap: it runs only when the Dockerfile changes, and builds
# for x86-64 unless ARM64 is asked for on a manual run (emulated ARM builds take far longer).
name: solver-image

on:
  push:
    branches: [master]
    paths: [workstation/Dockerfile]
  workflow_dispatch:
    inputs:
      arm64:
        description: Also build for ARM64 (slow)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Name the image
        id: image
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/icarus-solvers"
          hash="$(sha256sum workstation/Dockerfile | cut -c1-12)"
          platforms=linux/amd64
          if [[ "${{ inputs.arm64 }}" == "true" ]]; then platforms=linux/amd64,linux/arm64; fi
          echo "tag=$repo:$hash" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: inputs.arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: workstation
          file: workstation/Dockerfile
          platforms: ${{ steps.image.outputs.platforms }}
          tags: ${{ steps.image.outputs.tag }}
          # Ties the package to this repo, so it shows under the repo and the workflow can push to it.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
